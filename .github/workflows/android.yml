```yaml
name: Android Release

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      MEDIA_REPO: zeroa234/ryza-ai-revive
      GH_TOKEN: ${{ github.token }}
      RYZA_KEYSTORE_B64: ${{ secrets.RYZA_KEYSTORE_B64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        shell: powershell
        run: |
          $versionInfo = Get-Content "config/version.json" -Raw | ConvertFrom-Json

          "RYZA_VERSION=$($versionInfo.version)" >> $env:GITHUB_ENV
          "RYZA_VERSION_CODE=$($versionInfo.code)" >> $env:GITHUB_ENV

          Write-Host "Version: $($versionInfo.version)"
          Write-Host "Version code: $($versionInfo.code)"

      - name: Restore fixed signing keystore
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RYZA_KEYSTORE_B64)) {
            throw "RYZA_KEYSTORE_B64 repository secret is missing."
          }

          $keystoreDir = "android/keystore"
          $keystorePath = Join-Path $keystoreDir "ryza.keystore"

          New-Item -ItemType Directory -Force $keystoreDir | Out-Null

          try {
            $base64 = $env:RYZA_KEYSTORE_B64 -replace '\s', ''
            $bytes = [Convert]::FromBase64String($base64)

            [System.IO.File]::WriteAllBytes(
              $keystorePath,
              $bytes
            )
          }
          catch {
            throw "RYZA_KEYSTORE_B64 is not valid Base64."
          }

          if (-not (Test-Path $keystorePath)) {
            throw "Keystore was not created."
          }

          Write-Host "Fixed signing keystore restored."

      - name: Download media seed APK
        shell: powershell
        run: |
          $apkName = "RyzaChat-$env:RYZA_VERSION.apk"

          Write-Host "Downloading $apkName from $env:MEDIA_REPO ..."

          gh release download "v$env:RYZA_VERSION" `
            --repo $env:MEDIA_REPO `
            --pattern $apkName `
            --output $apkName `
            --clobber

          if (-not (Test-Path $apkName)) {
            throw "Media seed APK was not downloaded."
          }

          $sizeMB = [math]::Round(
            (Get-Item $apkName).Length / 1MB,
            1
          )

          Write-Host "Downloaded seed APK: $sizeMB MB"

      - name: Restore media
        shell: powershell
        run: |
          python scripts/restore_media.py `
            "RyzaChat-$env:RYZA_VERSION.apk"

          if ($LASTEXITCODE -ne 0) {
            throw "restore_media.py failed."
          }

          Write-Host "Media restore completed."

      - name: Setup Android toolchain
        shell: powershell
        run: |
          Write-Host "Running project Android toolchain setup..."

          powershell -ExecutionPolicy Bypass `
            -File scripts/setup_android_tools.ps1

          $tools = Join-Path $PWD ".android-tools"
          $jdk = Join-Path $tools "jdk17"
          $sdk = Join-Path $tools "android-sdk"
          $sm  = Join-Path $sdk "cmdline-tools\latest\bin\sdkmanager.bat"

          $javac = Join-Path $jdk "bin\javac.exe"
          $aapt2 = Join-Path $sdk "build-tools\34.0.0\aapt2.exe"
          $androidJar = Join-Path $sdk "platforms\android-34\android.jar"

          Write-Host ""
          Write-Host "Checking Android toolchain..."
          Write-Host "Javac:      $javac"
          Write-Host "AAPT2:      $aapt2"
          Write-Host "Android.jar:$androidJar"
          Write-Host "SDKManager: $sm"
          Write-Host ""

          # The upstream setup script can finish without failing the step
          # even when sdkmanager failed. Therefore verify ourselves.
          if (-not (Test-Path $sm)) {
            throw "sdkmanager.bat was not found: $sm"
          }

          if (-not (Test-Path $javac)) {
            throw "JDK 17 was not installed correctly: $javac"
          }

          $env:JAVA_HOME = $jdk
          $env:Path = "$jdk\bin;$env:Path"

          # If build-tools are missing, explicitly install them again.
          if (-not (Test-Path $aapt2)) {
            Write-Host "AAPT2 is missing. Installing Android packages explicitly..."

            Write-Host "Accepting Android SDK licenses..."
            $licenseInput = 1..200 | ForEach-Object { "y" }

            $licenseInput | & $sm --sdk_root="$sdk" --licenses

            Write-Host "Installing required Android packages..."

            & $sm `
              --sdk_root="$sdk" `
              "platform-tools" `
              "platforms;android-34" `
              "build-tools;34.0.0"

            if ($LASTEXITCODE -ne 0) {
              throw "sdkmanager failed with exit code $LASTEXITCODE"
            }
          }

          Write-Host ""
          Write-Host "Final toolchain verification..."

          if (-not (Test-Path $aapt2)) {
            throw "AAPT2 is still missing: $aapt2"
          }

          if (-not (Test-Path $androidJar)) {
            throw "android.jar is still missing: $androidJar"
          }

          Write-Host "Android toolchain is ready."

          & $javac -version
          & $aapt2 version

      - name: Show restored media
        shell: powershell
        run: |
          if (-not (Test-Path "web/assets")) {
            throw "web/assets does not exist after media restore."
          }

          $files = Get-ChildItem "web/assets" -Recurse -File |
            Where-Object {
              $_.Extension.ToLower() -in @(
                ".png",
                ".jpg",
                ".jpeg",
                ".webp",
                ".gif",
                ".m4a",
                ".mp3",
                ".wav",
                ".ogg",
                ".aac",
                ".skel",
                ".ttf",
                ".otf"
              )
            }

          Write-Host "Restored media file count: $($files.Count)"

          $files |
            Group-Object Extension |
            Sort-Object Name |
            Format-Table Name, Count

      - name: Build APK
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass `
            -File scripts/build_apk.ps1

          if ($LASTEXITCODE -ne 0) {
            throw "APK build failed."
          }

      - name: Verify APK
        shell: powershell
        run: |
          $apk = Get-ChildItem "output/android/RyzaChat-*.apk" |
            Select-Object -First 1

          if (-not $apk) {
            throw "APK was not found."
          }

          $sizeMB = [math]::Round(
            $apk.Length / 1MB,
            1
          )

          Write-Host "======================================"
          Write-Host "APK: $($apk.FullName)"
          Write-Host "Size: $sizeMB MB"
          Write-Host "======================================"

      - name: Verify APK signature
        shell: powershell
        run: |
          $apk = Get-ChildItem "output/android/RyzaChat-*.apk" |
            Select-Object -First 1

          $tools = Join-Path $PWD ".android-tools"
          $apksigner = Join-Path $tools "android-sdk\build-tools\34.0.0\apksigner.bat"

          & $apksigner verify --verbose $apk.FullName

          if ($LASTEXITCODE -ne 0) {
            throw "APK signature verification failed."
          }

      - name: Create GitHub Release and upload APK
        shell: powershell
        run: |
          $apk = Get-ChildItem "output/android/RyzaChat-*.apk" |
            Select-Object -First 1

          if (-not $apk) {
            throw "APK not found for release."
          }

          $tag = "ryza-v$env:RYZA_VERSION-build.$env:GITHUB_RUN_NUMBER"
          $title = "Ryza Chat $env:RYZA_VERSION (Build $env:GITHUB_RUN_NUMBER)"

          Write-Host "Creating release: $tag"

          gh release create "$tag" `
            "$($apk.FullName)" `
            --repo "$env:GITHUB_REPOSITORY" `
            --title "$title" `
            --generate-notes `
            --target "$env:GITHUB_SHA"

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release creation failed."
          }

          Write-Host "Release published successfully."
```
