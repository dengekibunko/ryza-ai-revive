name: Android Release

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      MEDIA_REPO: zeroa234/ryza-ai-revive
      GH_TOKEN: ${{ github.token }}
      RYZA_KEYSTORE_B64: ${{ secrets.RYZA_KEYSTORE_B64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Configure Android toolchain
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Configuring GitHub Runner Android SDK"
          Write-Host "======================================"

          $runnerSdk = $env:ANDROID_HOME
          $runnerJdk = $env:JAVA_HOME

          if ([string]::IsNullOrWhiteSpace($runnerSdk)) {
            throw "ANDROID_HOME is not set."
          }

          if ([string]::IsNullOrWhiteSpace($runnerJdk)) {
            throw "JAVA_HOME is not set."
          }

          Write-Host "Runner SDK: $runnerSdk"
          Write-Host "Runner JDK: $runnerJdk"

          $toolsRoot = Join-Path $PWD ".android-tools"
          $sdkLink = Join-Path $toolsRoot "android-sdk"
          $jdkLink = Join-Path $toolsRoot "jdk17"

          New-Item -ItemType Directory -Force $toolsRoot | Out-Null

          if (Test-Path $sdkLink) {
            Remove-Item -Recurse -Force $sdkLink
          }

          if (Test-Path $jdkLink) {
            Remove-Item -Recurse -Force $jdkLink
          }

          # build_apk.ps1 expects:
          #
          # .android-tools/
          #   ├── android-sdk/
          #   └── jdk17/
          #
          # Use Windows directory junctions instead of copying the SDK/JDK.
          New-Item `
            -ItemType Junction `
            -Path $sdkLink `
            -Target $runnerSdk | Out-Null

          New-Item `
            -ItemType Junction `
            -Path $jdkLink `
            -Target $runnerJdk | Out-Null

          # Tell build_apk.ps1 to use this directory.
          "RYZA_ANDROID_TOOLS=$toolsRoot" >> $env:GITHUB_ENV

          $aapt2 = Join-Path $sdkLink "build-tools\34.0.0\aapt2.exe"
          $aapt = Join-Path $sdkLink "build-tools\34.0.0\aapt.exe"
          $d8 = Join-Path $sdkLink "build-tools\34.0.0\d8.bat"
          $zipalign = Join-Path $sdkLink "build-tools\34.0.0\zipalign.exe"
          $apksigner = Join-Path $sdkLink "build-tools\34.0.0\apksigner.bat"
          $androidJar = Join-Path $sdkLink "platforms\android-34\android.jar"
          $javac = Join-Path $jdkLink "bin\javac.exe"

          Write-Host ""
          Write-Host "Checking required tools..."
          Write-Host "AAPT2:       $aapt2"
          Write-Host "AAPT:        $aapt"
          Write-Host "D8:          $d8"
          Write-Host "Zipalign:    $zipalign"
          Write-Host "Apksigner:   $apksigner"
          Write-Host "Android.jar: $androidJar"
          Write-Host "Javac:       $javac"
          Write-Host ""

          $required = @(
            $aapt2,
            $aapt,
            $d8,
            $zipalign,
            $apksigner,
            $androidJar,
            $javac
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Required Android tool is missing: $file"
            }
          }

          Write-Host "Android toolchain verification passed."

          & $javac -version
          & $aapt2 version

      - name: Read version
        shell: powershell
        run: |
          $versionInfo = Get-Content "config/version.json" -Raw |
            ConvertFrom-Json

          "RYZA_VERSION=$($versionInfo.version)" >> $env:GITHUB_ENV
          "RYZA_VERSION_CODE=$($versionInfo.code)" >> $env:GITHUB_ENV

          Write-Host "Version: $($versionInfo.version)"
          Write-Host "Version code: $($versionInfo.code)"

      - name: Restore fixed signing keystore
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RYZA_KEYSTORE_B64)) {
            throw "RYZA_KEYSTORE_B64 repository secret is missing."
          }

          $keystoreDir = "android/keystore"
          $keystorePath = Join-Path $keystoreDir "ryza.keystore"

          New-Item `
            -ItemType Directory `
            -Force `
            $keystoreDir | Out-Null

          try {
            $base64 = $env:RYZA_KEYSTORE_B64 -replace '\s', ''
            $bytes = [Convert]::FromBase64String($base64)

            [System.IO.File]::WriteAllBytes(
              $keystorePath,
              $bytes
            )
          }
          catch {
            throw "RYZA_KEYSTORE_B64 is not valid Base64."
          }

          if (-not (Test-Path $keystorePath)) {
            throw "Keystore was not created."
          }

          Write-Host "Fixed signing keystore restored."

      - name: Download media seed APK
        shell: powershell
        run: |
          $apkName = "RyzaChat-$env:RYZA_VERSION.apk"

          Write-Host "Downloading $apkName from $env:MEDIA_REPO ..."

          gh release download "v$env:RYZA_VERSION" `
            --repo $env:MEDIA_REPO `
            --pattern $apkName `
            --output $apkName `
            --clobber

          if (-not (Test-Path $apkName)) {
            throw "Media seed APK was not downloaded."
          }

          $sizeMB = [math]::Round(
            (Get-Item $apkName).Length / 1MB,
            1
          )

          Write-Host "Downloaded seed APK: $sizeMB MB"

      - name: Restore media
        shell: powershell
        run: |
          python scripts/restore_media.py `
            "RyzaChat-$env:RYZA_VERSION.apk"

          if ($LASTEXITCODE -ne 0) {
            throw "restore_media.py failed."
          }

          if (-not (Test-Path "web/assets")) {
            throw "web/assets does not exist after media restore."
          }

          Write-Host "Media restore completed."

      - name: Show restored media
        shell: powershell
        run: |
          $files = Get-ChildItem "web/assets" -Recurse -File |
            Where-Object {
              $_.Extension.ToLower() -in @(
                ".png",
                ".jpg",
                ".jpeg",
                ".webp",
                ".gif",
                ".m4a",
                ".mp3",
                ".wav",
                ".ogg",
                ".aac",
                ".skel",
                ".ttf",
                ".otf"
              )
            }

          Write-Host "Restored media file count: $($files.Count)"

          if ($files.Count -eq 0) {
            throw "No media files were restored."
          }

          $files |
            Group-Object Extension |
            Sort-Object Name |
            Format-Table Name, Count

      - name: Build APK
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass `
            -File scripts/build_apk.ps1

          if ($LASTEXITCODE -ne 0) {
            throw "APK build failed."
          }

      - name: Verify APK
        shell: powershell
        run: |
          $apk = Get-ChildItem `
            "output/android/RyzaChat-*.apk" |
            Select-Object -First 1

          if (-not $apk) {
            throw "APK was not found."
          }

          $sizeMB = [math]::Round(
            $apk.Length / 1MB,
            1
          )

          Write-Host "======================================"
          Write-Host "APK:  $($apk.FullName)"
          Write-Host "Size: $sizeMB MB"
          Write-Host "======================================"

      - name: Verify APK signature
        shell: powershell
        run: |
          $apk = Get-ChildItem `
            "output/android/RyzaChat-*.apk" |
            Select-Object -First 1

          $apksigner = Join-Path `
            $env:RYZA_ANDROID_TOOLS `
            "android-sdk\build-tools\34.0.0\apksigner.bat"

          & $apksigner verify --verbose $apk.FullName

          if ($LASTEXITCODE -ne 0) {
            throw "APK signature verification failed."
          }

      - name: Create GitHub Release and upload APK
        shell: powershell
        run: |
          $apk = Get-ChildItem `
            "output/android/RyzaChat-*.apk" |
            Select-Object -First 1

          if (-not $apk) {
            throw "APK not found for release."
          }

          $tag = "ryza-v$env:RYZA_VERSION-build.$env:GITHUB_RUN_NUMBER"
          $title = "Ryza Chat $env:RYZA_VERSION (Build $env:GITHUB_RUN_NUMBER)"

          Write-Host "Creating release: $tag"

          gh release create "$tag" `
            "$($apk.FullName)" `
            --repo "$env:GITHUB_REPOSITORY" `
            --title "$title" `
            --generate-notes `
            --target "$env:GITHUB_SHA"

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release creation failed."
          }

          Write-Host "======================================"
          Write-Host "GitHub Release created successfully."
          Write-Host "Tag: $tag"
          Write-Host "======================================"
